[package]
name = "panpak-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[features]
# Test builds only: named points at which the program aborts when `PANPAK_FAILPOINT` names them (`panpak_core::failpoint!`). A release has none.
failpoints = []

[dependencies]
anyhow = "1"
blake3 = "1"
sha2 = "0.10"
zstd = "0.14"
ed25519-dalek = "2"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
landlock = "0.4"
dirs = "6"
libc = "0.2"
