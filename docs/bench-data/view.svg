<svg xmlns="http://www.w3.org/2000/svg" width="760" height="344" viewBox="0 0 760 344" role="img" aria-label="Cost of the isolated view: later starts with and without it">
<title>Cost of the isolated view: later starts with and without it</title>
<style>
  .bg { fill: #ffffff; }
  .fg { fill: #1f2328; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .muted { fill: #59636e; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .grid { stroke: #d1d9e0; stroke-width: 1; }
  .s0 { fill: #1f6feb; }
  .s1 { fill: #d9730d; }
  .s2 { fill: #1a7f64; }
  .s3 { fill: #6e7781; }
  .s4 { fill: #8250df; }
</style>
<rect class="bg" x="0" y="0" width="760" height="344"/>
<text class="fg" x="16" y="26" font-size="16" font-weight="600">Cost of the isolated view: later starts with and without it</text>
<text class="muted" x="16" y="46" font-size="12">Median of 10 alternating runs per bar; the no-view side runs inside a namespace wrapper that makes bubblewrap unusable</text>
<line class="grid" x1="215" y1="62" x2="215" y2="268"/>
<text class="fg" x="205" y="94" font-size="13" text-anchor="end">ail</text>
<rect class="s0" x="215" y="70" width="207.5" height="18" rx="2"/>
<text class="fg" x="428.5" y="83" font-size="12">41 ms</text>
<rect class="s1" x="215" y="92" width="155.4" height="18" rx="2"/>
<text class="fg" x="376.4" y="105" font-size="12">31 ms</text>
<text class="fg" x="205" y="156" font-size="13" text-anchor="end">qownnotes</text>
<rect class="s0" x="215" y="132" width="236.5" height="18" rx="2"/>
<text class="fg" x="457.5" y="145" font-size="12">47 ms</text>
<rect class="s1" x="215" y="154" width="177.9" height="18" rx="2"/>
<text class="fg" x="398.9" y="167" font-size="12">36 ms</text>
<text class="fg" x="205" y="218" font-size="13" text-anchor="end">prusaslicer</text>
<rect class="s0" x="215" y="194" width="435.0" height="18" rx="2"/>
<text class="fg" x="656.0" y="207" font-size="12">87 ms</text>
<rect class="s1" x="215" y="216" width="370.9" height="18" rx="2"/>
<text class="fg" x="591.9" y="229" font-size="12">74 ms</text>
<rect class="s0" x="16" y="280" width="12" height="12" rx="2"/>
<text class="fg" x="34" y="291" font-size="12">With the view</text>
<rect class="s1" x="147" y="280" width="12" height="12" rx="2"/>
<text class="fg" x="165" y="291" font-size="12">Without the view (wrapper)</text>
<text class="muted" x="16" y="318" font-size="11">AMD Ryzen 7 7735HS, Ubuntu 26.04.1 LTS, kernel 7.0.0-38-generic, 2026-10-31</text>
<text class="muted" x="16" y="332" font-size="11">Control: /bin/true takes 1 ms alone and 6 ms under the wrapper that disables the view.</text>
</svg>
