# Proposes updates for the commit SHAs that pin the actions in the workflows.
# Cargo is deliberately not enabled: dependencies are updated by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      # One pull request for all the actions, so that one CI run covers them.
      github-actions:
        patterns:
          - "*"
