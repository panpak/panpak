# SPDX-License-Identifier: MIT OR Apache-2.0
# Panpak CI: build, test, clippy, fuzz smoke, reproducibility, distro matrix.
# No secrets (only the default read-only token), no publish.
#
# Three levels (the measured times are in docs/CI.md):
#   - fast, required on every pull request: changes, DCO, secrets, licenses (cargo-deny),
#     clippy, build-test and rust-tests (build, unit tests, conformance, the security tests of the
#     isolated view) and private-bus (the private bus against a systemd user session).
#     The heavy ones run only when the pull request touches more than documentation
#     (*.md and docs/**, see scripts/ci-changes.sh). repro also runs on a pull request
#     that changes REPRODUCIBLE-HASHES.md. `changes` also checks, with no build, that a pull request that touches the code carries a
#     reference with the date of its last code commit (scripts/check-repro-date.sh).
#   - full, on every push to main (which also fills the caches that pull requests
#     start from), on a manual run, on the weekly run, and on a pull request that has
#     the label `full-ci`: the fast level plus fuzz-smoke, repro and distro.
#   - weekly (Monday): the full level with a longer fuzz run, which catches new
#     advisories, new nightly toolchains and drift in the base images even when nobody
#     opens a pull request. The weekly app harness is the workflow apps-harness.
#     The repository is public, where Actions minutes are free.
#   - gate: always the last job. It fails when a job that had to run did not
#     succeed, and also when a job that had to run was skipped
#     (scripts/ci-gate.sh). Require this job, not the others, in the branch rules.
#   - every job that depends on a job that can be skipped has !cancelled() in its
#     if: an if: without a status function means success(), which is false when any
#     job above it, however far, was skipped (tests/ci-workflow-test.py checks this).
#   - a new push to a pull request cancels the run in progress (concurrency, below);
#     every job has a time limit.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    # `labeled`: putting the label full-ci on a pull request starts the full level.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
  schedule:
    # Every Monday, 03:17 UTC.
    - cron: "17 3 * * 1"

# One run per ref: a new push cancels the previous run of the same branch or pull
# request. The scheduled and manual runs have their own group, so a push to main
# does not cancel them.
concurrency:
  group: ci-${{ (github.event_name == 'push' || github.event_name == 'pull_request') && github.ref || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: true

# Read-only token for every job (explicit, whatever the default of the repository is).
permissions:
  contents: read

defaults:
  run:
    # An explicit shell makes GitHub run bash -eo pipefail: a failing command
    # anywhere in a pipe fails the step. Every job runs directly on the
    # ubuntu-24.04 runner, none inside a container.
    shell: bash

env:
  RUST_TOOLCHAIN: "1.99.1"
  # Nightly used only by the fuzz-smoke job (libfuzzer needs -Z flags).
  FUZZ_NIGHTLY: "nightly-2026-10-20"
  # A test that cannot run here (no bubblewrap, no Zig, a kernel too old, no sway) fails with the reason instead of skipping: a skip is a test
  # that passes without having run. The shared skip functions of the tests read it (tests/isolation.py `skip`, panpak-stub/src/testutil.rs `skip`).
  PANPAK_CI: "1"

jobs:
  monday:
    # Scheduled runs only: continue on Monday, stop on any other day (the cron
    # fires on Mondays only; this is a second check, and keeps the shape that the
    # other jobs depend on). Every other job lists this one in needs and starts
    # unless the answer is exactly "false" (the job is skipped on other events,
    # which leaves the answer empty).
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.monday.outputs.run }}
    steps:
      - name: Monday
        timeout-minutes: 11
        id: monday
        run: |
          if [ "$(date -u +%u)" = 1 ]; then run=true; else run=false; fi
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"

  changes:
    # Decides which jobs are needed. Plain git, no third-party action.
    needs: monday
    if: ${{ !cancelled() && needs.monday.outputs.run != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      heavy: ${{ steps.classify.outputs.heavy }}
      fuzz: ${{ steps.classify.outputs.fuzz }}
      distro: ${{ steps.classify.outputs.distro }}
      repro: ${{ steps.classify.outputs.repro }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          fetch-depth: 0
      - name: Classify the changed files and the level
        timeout-minutes: 3
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            ./scripts/ci-changes.sh "$BASE_SHA" "$HEAD_SHA" "$FULL_LABEL" | tee -a "$GITHUB_OUTPUT"
          else
            ./scripts/ci-changes.sh "" "" true | tee -a "$GITHUB_OUTPUT"
          fi
      - name: The build date of the reference follows the code (no build)
        timeout-minutes: 3
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/check-repro-date.sh "$BASE_SHA" "$HEAD_SHA"

  # The unit tests of the Rust workspace, the release build and the test points (the failpoints): the half of what build-test did that needs no scripts. It runs beside
  # build-test, which keeps the artifact for the distro matrix and all the scripts; `gate` waits for both.
  rust-tests:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.heavy == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - name: Cache the Rust build (registry and target)
        timeout-minutes: 5
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: build-test-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            build-test-${{ env.RUST_TOOLCHAIN }}-
      - name: Cache the Rust toolchain (the key holds the version and the components)
        timeout-minutes: 5
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/${{ env.RUST_TOOLCHAIN }}-x86_64-unknown-linux-gnu
            ~/.rustup/update-hashes/${{ env.RUST_TOOLCHAIN }}-x86_64-unknown-linux-gnu
          key: rustup-${{ env.RUST_TOOLCHAIN }}-minimal-rustfmt-musl
      - name: Pinned Rust toolchain
        timeout-minutes: 3
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          rustup target add --toolchain "$RUST_TOOLCHAIN" x86_64-unknown-linux-musl
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Zig (pinned PyPI wheel, hash-checked)
        timeout-minutes: 3
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          # A read timeout of the download (files.pythonhosted.org) failed a run of main: three tries, 60 s each, the hash check stays.
          ok=0
          for try in 1 2 3; do
            if "$RUNNER_TEMP/zig/bin/pip" install --timeout 60 --require-hashes -r tools/requirements-zig.txt; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = 1 ]
          # Only the directory with the zig binary goes on PATH: the venv's python3
          # would hide the system Python that the conformance scripts need.
          "$RUNNER_TEMP/zig/bin/python" -c 'import os, ziglang; print(os.path.dirname(ziglang.__file__))' >> "$GITHUB_PATH"
      - name: Test dependencies
        timeout-minutes: 24
        run: ./scripts/apt-install.sh zstd python3 python3-cryptography squashfs-tools
      - name: Bubblewrap and user namespaces (for the isolated view)
        timeout-minutes: 24
        # Ubuntu 24.04 lets an unprivileged program make a user namespace only under an AppArmor profile; the
        # tests after it run bubblewrap as the runner user, so the restriction is lifted for this job's machine.
        run: |
          ./scripts/apt-install.sh --no-update bubblewrap xvfb x11-utils python3-gi gir1.2-gtk-3.0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-all --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib --symlink usr/lib64 /lib64 /bin/true && echo "bubblewrap works"
          bwrap --version
      - name: The programs that some tests start (cargo test does not build the stub by itself, and the tests of the windows use the debug build)
        timeout-minutes: 3
        run: cargo build --locked --target x86_64-unknown-linux-musl -p panpak -p panpak-stub
      - name: Test (musl)
        timeout-minutes: 11
        # --no-fail-fast: one failing test does not hide the others (the first run with PANPAK_CI=1 shows every test that used to skip).
        env:
          PANPAK_SKIP_LOG: /tmp/panpak-known-skips.txt
        run: cargo test --locked --no-fail-fast --target x86_64-unknown-linux-musl
      - name: Protected mode, the way it is shown (the notification and its button, the windows, the questions of the terminal; fakes of the tools and the service)
        timeout-minutes: 3
        run: python3 tests/with_timeout.py 120 tests/protected_ui.py
      - name: The tests that cannot run on this runner (named, never silent)
        timeout-minutes: 3
        run: |
          {
            echo "### Known skips (the runner's kernel is older than the test needs)"
            sort -u /tmp/panpak-known-skips.txt 2>/dev/null || echo "(none)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Release build (conformance and artifacts)
        timeout-minutes: 4
        run: cargo build --locked --release --target x86_64-unknown-linux-musl
      - name: Test points (every command stopped at every named point; a release has none)
        timeout-minutes: 11
        run: |
          cargo build --locked --release --target x86_64-unknown-linux-musl --target-dir target/failpoints --features panpak/failpoints,panpak-stub/failpoints -p panpak -p panpak-stub
          ./scripts/check-no-failpoints.sh target/x86_64-unknown-linux-musl/release/panpak target/x86_64-unknown-linux-musl/release/panpak-stub
          ./scripts/check-no-failpoints.sh --expect target/failpoints/x86_64-unknown-linux-musl/release/panpak target/failpoints/x86_64-unknown-linux-musl/release/panpak-stub
          python3 tests/with_timeout.py 600 tests/failpoints.py
      - name: A blob is visible only when it is on disk (a kill between writing and naming)
        timeout-minutes: 24
        run: |
          ./scripts/apt-install.sh --no-update strace
          python3 tests/with_timeout.py 120 tests/blob_visibility.py
      - name: Lock files left by an app that stops on a signal
        timeout-minutes: 3
        run: python3 tests/with_timeout.py 120 tests/stale_lock_exit.py
      - name: Update with icons (changed, removed, new sizes, none)
        timeout-minutes: 3
        run: python3 tests/with_timeout.py 120 tests/update_icons.py

  build-test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.heavy == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - name: Cache the Rust build (registry and target)
        timeout-minutes: 5
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: build-test-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            build-test-${{ env.RUST_TOOLCHAIN }}-
      - name: Cache the Rust toolchain (the key holds the version and the components)
        timeout-minutes: 5
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/${{ env.RUST_TOOLCHAIN }}-x86_64-unknown-linux-gnu
            ~/.rustup/update-hashes/${{ env.RUST_TOOLCHAIN }}-x86_64-unknown-linux-gnu
          key: rustup-${{ env.RUST_TOOLCHAIN }}-minimal-rustfmt-musl
      - name: Pinned Rust toolchain
        timeout-minutes: 3
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          rustup target add --toolchain "$RUST_TOOLCHAIN" x86_64-unknown-linux-musl
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Zig (pinned PyPI wheel, hash-checked)
        timeout-minutes: 3
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          # A read timeout of the download (files.pythonhosted.org) failed a run of main: three tries, 60 s each, the hash check stays.
          ok=0
          for try in 1 2 3; do
            if "$RUNNER_TEMP/zig/bin/pip" install --timeout 60 --require-hashes -r tools/requirements-zig.txt; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = 1 ]
          # Only the directory with the zig binary goes on PATH: the venv's python3
          # would hide the system Python that the conformance scripts need.
          "$RUNNER_TEMP/zig/bin/python" -c 'import os, ziglang; print(os.path.dirname(ziglang.__file__))' >> "$GITHUB_PATH"
      - name: Test dependencies
        timeout-minutes: 24
        run: ./scripts/apt-install.sh zstd python3 python3-cryptography squashfs-tools
      - name: Bubblewrap and user namespaces (for the isolated view)
        timeout-minutes: 24
        # Ubuntu 24.04 lets an unprivileged program make a user namespace only under an AppArmor profile; the
        # tests after it run bubblewrap as the runner user, so the restriction is lifted for this job's machine.
        run: |
          ./scripts/apt-install.sh --no-update bubblewrap xvfb x11-utils python3-gi gir1.2-gtk-3.0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-all --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib --symlink usr/lib64 /lib64 /bin/true && echo "bubblewrap works"
          bwrap --version
      - name: Release build (conformance and artifacts)
        timeout-minutes: 4
        run: cargo build --locked --release --target x86_64-unknown-linux-musl
      - name: Format conformance (independent verifier)
        timeout-minutes: 3
        run: |
          python3 conformance/gen.py
          python3 conformance/run.py --rust
      - name: Hardening (seccomp filter and system font cache, through the real launcher)
        timeout-minutes: 3
        run: python3 tests/with_timeout.py 120 tests/hardening.py
      - name: The socket probe (a measurement mode that must stay off unless asked for)
        timeout-minutes: 3
        run: python3 tests/with_timeout.py 120 tests/socket_probe.py
      - name: The app folders and the private home (what an app can read and write in its home)
        timeout-minutes: 3
        run: python3 tests/with_timeout.py 120 tests/app_dirs.py
      - name: The warm cache of the library resolution, the licenses of a package
        timeout-minutes: 3
        run: |
          python3 tests/with_timeout.py 120 tests/abi_cache.py
          python3 tests/with_timeout.py 120 tests/licenses.py
      - name: A start against a removal (needs the debug panpak, which has the hook that makes a removal slow)
        timeout-minutes: 4
        run: |
          cargo build --locked -p panpak
          python3 tests/with_timeout.py 150 tests/remove_race.py
      - name: A real X11 client under Landlock (a dedicated Xvfb)
        timeout-minutes: 3
        run: python3 tests/with_timeout.py 120 tests/x11.py
      - name: A change of the user's theme or settings reaches a running app (GTK 3 on a dedicated Xvfb; Qt settings folders)
        timeout-minutes: 3
        run: python3 tests/with_timeout.py 120 tests/env_live.py
      - name: The unit tests of the app harness
        timeout-minutes: 3
        run: python3 -m unittest discover -s tests/apps -p 'test_*.py'
      - name: The helpers of the tests (a work folder with read-only trees is removed whole)
        timeout-minutes: 3
        run: |
          python3 tests/with_timeout.py 120 tests/isolation_test.py
          python3 tests/with_timeout_test.py
          python3 tests/apt_install_test.py
      - name: The isolated view, end to end (full level only, 2.5 minutes)
        timeout-minutes: 9
        # `fuzz` is the output of the full level (a push to main, a manual or weekly run, the label full-ci) and of a change that is not documentation.
        if: ${{ needs.changes.outputs.fuzz == 'true' }}
        run: python3 tests/with_timeout.py 480 tests/view.py
      - name: A pty in the isolated view (shell, window size, job control, a full-screen program)
        timeout-minutes: 3
        run: python3 tests/with_timeout.py 120 tests/pty.py
      - name: The [env] table (variables that point an app at its own tree)
        timeout-minutes: 3
        run: python3 tests/with_timeout.py 120 tests/pkgenv.py
      - name: One copy in the store (install, record, repair, update, rollback, remove)
        timeout-minutes: 3
        run: python3 tests/with_timeout.py 120 tests/store_flow.py
      - name: The background job (check, backoff, rotating verification, settings)
        timeout-minutes: 3
        run: python3 tests/with_timeout.py 120 tests/background.py
      - name: Work at the end of the last copy, and downloads over HTTPS with a test authority
        timeout-minutes: 3
        run: python3 tests/with_timeout.py 120 tests/exit_work.py
      - name: Garbage collection (reachability from the records, the store lock, copies, concurrency)
        timeout-minutes: 3
        run: python3 tests/with_timeout.py 120 tests/gc.py
      - name: A store copied to another path (relative links)
        timeout-minutes: 3
        run: python3 tests/with_timeout.py 120 tests/store_move.py
      - name: A package cannot take the record of another app (PP-01)
        timeout-minutes: 3
        run: python3 tests/with_timeout.py 120 tests/record_names.py
      - name: An update against a footer that lies (PP-03)
        timeout-minutes: 3
        run: python3 tests/with_timeout.py 120 tests/update_footer.py
      - name: The release table over HTTP (revision, floor, channel, history, the security number)
        timeout-minutes: 3
        run: python3 tests/with_timeout.py 120 tests/release_update.py
      - name: Protected mode (below the floor, no host network and no written programs; the internet back on; the end of the mode)
        timeout-minutes: 3
        run: python3 tests/with_timeout.py 120 tests/protected_mode.py
      - name: The folder that --write-rename opens (PP-07)
        timeout-minutes: 3
        run: python3 tests/with_timeout.py 120 tests/open_rename.py
      - name: The collection keeps what it cannot read the links of (P2-04)
        timeout-minutes: 3
        run: python3 tests/with_timeout.py 120 tests/gc_unreadable.py
      - name: Help, version and a wrong command write nothing; the personal key is made when a package is signed
        timeout-minutes: 3
        run: python3 tests/with_timeout.py 120 tests/no_side_effects.py
      - name: convert unpacks on disk and counts before it writes
        timeout-minutes: 3
        run: python3 tests/with_timeout.py 120 tests/convert_workdir.py
      - name: A rollback takes only a record of the same app (P2-09)
        timeout-minutes: 3
        run: python3 tests/with_timeout.py 120 tests/rollback_identity.py
      - name: convert cannot be led out of its tree by two links (P2-03)
        timeout-minutes: 3
        run: python3 tests/with_timeout.py 120 tests/convert_links.py
      - name: Install and update stopped by a kill at many moments
        timeout-minutes: 4
        run: python3 tests/with_timeout.py 150 tests/interrupt_8a.py
      - name: The app harness (list of apps, signing, window readers; no network)
        timeout-minutes: 3
        run: python3 -m unittest discover -s tests/apps -p 'test_*.py'
      - name: Startup budget (advisory)
        timeout-minutes: 3
        # Reports the fixed cost of a start against running the program directly. Advisory until a week of
        # numbers from these runners shows how steady they are; then it moves into the gate.
        continue-on-error: true
        run: python3 tests/with_timeout.py 120 tests/startup_budget.py --advisory --runs 30 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Artifacts (static stub for the distro matrix)
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: panpak-stub-musl
          path: target/x86_64-unknown-linux-musl/release/panpak-stub

  # The Wayland security context against a real compositor. Advisory, and off the path that the gate waits for: it is not in `needs` of `gate`, it makes its own
  # release build, and `continue-on-error` keeps a failure here from turning the run red. It used to be a step of build-test (7 to 284 s there, most of it `apt`).
  sway:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.heavy == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - name: Cache the Rust build (registry and target)
        timeout-minutes: 5
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: sway-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            sway-${{ env.RUST_TOOLCHAIN }}-
            build-test-${{ env.RUST_TOOLCHAIN }}-
      - name: Pinned Rust toolchain
        timeout-minutes: 3
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add --toolchain "$RUST_TOOLCHAIN" x86_64-unknown-linux-musl
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Zig (pinned PyPI wheel, hash-checked)
        timeout-minutes: 3
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          ok=0
          for try in 1 2 3; do
            if "$RUNNER_TEMP/zig/bin/pip" install --timeout 60 --require-hashes -r tools/requirements-zig.txt; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = 1 ]
          "$RUNNER_TEMP/zig/bin/python" -c 'import os, ziglang; print(os.path.dirname(ziglang.__file__))' >> "$GITHUB_PATH"
      - name: Bubblewrap, Sway and user namespaces
        timeout-minutes: 18
        run: |
          ./scripts/apt-install.sh bubblewrap sway
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Release build
        timeout-minutes: 5
        run: cargo build --locked --release --target x86_64-unknown-linux-musl -p panpak -p panpak-stub
      - name: Wayland security context against Sway (headless)
        timeout-minutes: 3
        # Sway 1.9 on this image has the protocol. The test prints SKIP and succeeds when Sway cannot start here.
        run: python3 tests/with_timeout.py 120 tests/wayland_sway.py

  private-bus:
    # The private bus of each app against a real user session: a router, two proxies, the portal of the runner with the fake backend of the lab. The
    # tests need a systemd user manager (the app is put in a scope of its own), so the job starts one for the runner user.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.heavy == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - name: Cache the Rust build (registry and target)
        timeout-minutes: 5
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: private-bus-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            private-bus-${{ env.RUST_TOOLCHAIN }}-
      - name: Pinned Rust toolchain
        timeout-minutes: 3
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add --toolchain "$RUST_TOOLCHAIN" x86_64-unknown-linux-musl
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Zig (pinned PyPI wheel, hash-checked)
        timeout-minutes: 3
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          # A read timeout of the download (files.pythonhosted.org) failed a run of main: three tries, 60 s each, the hash check stays.
          ok=0
          for try in 1 2 3; do
            if "$RUNNER_TEMP/zig/bin/pip" install --timeout 60 --require-hashes -r tools/requirements-zig.txt; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = 1 ]
          "$RUNNER_TEMP/zig/bin/python" -c 'import os, ziglang; print(os.path.dirname(ziglang.__file__))' >> "$GITHUB_PATH"
      - name: Release build
        timeout-minutes: 4
        run: cargo build --locked --release --target x86_64-unknown-linux-musl -p panpak -p panpak-stub
      - name: Packages, bubblewrap, and a systemd user manager for the runner user
        timeout-minutes: 24
        run: |
          ./scripts/apt-install.sh bubblewrap dbus-daemon dbus-user-session xdg-dbus-proxy xdg-desktop-portal python3-gi gir1.2-glib-2.0 gir1.2-gtk-4.0 sway libglib2.0-bin at-spi2-core
          # Ubuntu 24.04 lets an unprivileged program make a user namespace only under an AppArmor profile (see the build-test job).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          for i in $(seq 1 50); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 0.2; done
          ls -la "/run/user/$(id -u)/" || true
          XDG_RUNTIME_DIR="/run/user/$(id -u)" systemctl --user is-system-running || true
          xdg-desktop-portal --version || /usr/libexec/xdg-desktop-portal --version || true
      - name: Private bus, required scenarios (A, B, C, F11, F22, F23, L, P, D, T)
        timeout-minutes: 3
        env:
          PANPAK_REQUIRE_LAB: "1"
          PANPAK_LAB_LOG: ${{ runner.temp }}/lab.log
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          python3 tests/with_timeout.py 120 tests/privbus.py --only A,B,C,F,L,P,D,T || { echo '--- lab log'; cat "$PANPAK_LAB_LOG" 2>/dev/null | tail -60; exit 1; }
      - name: A real GTK 4 program against the answers of the file chooser (a refused dialog must not crash the app)
        timeout-minutes: 4
        run: python3 tests/with_timeout.py 150 tests/gtk_filechooser.py
      - name: Private bus, all scenarios (advisory until they have passed on the runners for a while; the portal here is 1.18, older than the one the identity needs)
        timeout-minutes: 5
        continue-on-error: true
        env:
          PANPAK_LAB_LOG: ${{ runner.temp }}/lab2.log
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          python3 tests/with_timeout.py 210 tests/privbus.py || { echo '--- lab log'; cat "$PANPAK_LAB_LOG" 2>/dev/null | tail -60; exit 1; }
      - name: Filtered session bus against a private bus (advisory; the lab portal of 1.18 does not export Settings with the fake backend)
        timeout-minutes: 3
        continue-on-error: true
        env:
          PANPAK_LAB_LOG: ${{ runner.temp }}/lab3.log
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          python3 tests/with_timeout.py 120 tests/dbus_filter.py || { echo '--- lab log'; cat "$PANPAK_LAB_LOG" 2>/dev/null | tail -60; exit 1; }

  clippy:
    needs: monday
    if: ${{ !cancelled() && needs.monday.outputs.run != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - name: Cache the Rust build (registry and target)
        timeout-minutes: 5
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: clippy-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            clippy-${{ env.RUST_TOOLCHAIN }}-
      - name: Pinned Rust toolchain
        timeout-minutes: 3
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          rustup target add --toolchain "$RUST_TOOLCHAIN" x86_64-unknown-linux-musl
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Zig (pinned PyPI wheel, hash-checked)
        timeout-minutes: 3
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          # A read timeout of the download (files.pythonhosted.org) failed a run of main: three tries, 60 s each, the hash check stays.
          ok=0
          for try in 1 2 3; do
            if "$RUNNER_TEMP/zig/bin/pip" install --timeout 60 --require-hashes -r tools/requirements-zig.txt; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = 1 ]
          # Only the directory with the zig binary goes on PATH: the venv's python3
          # would hide the system Python that the conformance scripts need.
          "$RUNNER_TEMP/zig/bin/python" -c 'import os, ziglang; print(os.path.dirname(ziglang.__file__))' >> "$GITHUB_PATH"
      - name: Clippy (zero warnings)
        timeout-minutes: 3
        run: cargo clippy --locked --all-targets --target x86_64-unknown-linux-musl -- -D warnings

  fuzz-smoke:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.fuzz == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # 30 s per target on pull requests and manual runs, 5 min in the scheduled run.
      FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '300' || '30' }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_index
          - fuzz_manifest
          - fuzz_footer
          - fuzz_pubkey
          - fuzz_rotation
          - fuzz_sigblock
          - fuzz_path
          - fuzz_locks
          - fuzz_zstd
          - fuzz_elf
          - fuzz_squash
          - fuzz_http
          - fuzz_dbus
          - fuzz_dbus_names
          - fuzz_journal
          - fuzz_wayland
          - fuzz_receiver
          - fuzz_icon
          - fuzz_router
          - fuzz_chooser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - name: Cache the cargo-fuzz binary
        timeout-minutes: 5
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-0.13.2-${{ runner.os }}
      - name: Cache the fuzz build (registry and fuzz/target)
        timeout-minutes: 5
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: fuzz-${{ env.FUZZ_NIGHTLY }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}
          restore-keys: |
            fuzz-${{ env.FUZZ_NIGHTLY }}-
      - name: Nightly toolchain (libfuzzer)
        timeout-minutes: 3
        run: |
          rustup toolchain install "$FUZZ_NIGHTLY" --profile minimal
          if ! ~/.cargo/bin/cargo-fuzz --version 2>/dev/null | grep -qF 0.13.2; then
            cargo install cargo-fuzz --locked --version 0.13.2
          fi
      - name: Fuzz smoke
        timeout-minutes: 5
        run: |
          cd fuzz
          cargo "+$FUZZ_NIGHTLY" fuzz run "${{ matrix.target }}" -- -max_total_time="$FUZZ_SECONDS" -print_final_stats=1

  repro:
    # No cache of any kind: the double build must start from nothing.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.repro == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          # The whole history, and the branch itself rather than the merge commit of a pull request: the build date is the date of the last commit
          # that touched the code (scripts/code-epoch.sh), the rule that panpak/build.rs uses.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pinned Rust toolchain
        timeout-minutes: 3
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add --toolchain "$RUST_TOOLCHAIN" x86_64-unknown-linux-musl
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Zig (pinned PyPI wheel, hash-checked)
        timeout-minutes: 3
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          # A read timeout of the download (files.pythonhosted.org) failed a run of main: three tries, 60 s each, the hash check stays.
          ok=0
          for try in 1 2 3; do
            if "$RUNNER_TEMP/zig/bin/pip" install --timeout 60 --require-hashes -r tools/requirements-zig.txt; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = 1 ]
          # Only the directory with the zig binary goes on PATH: the venv's python3
          # would hide the system Python that the conformance scripts need.
          "$RUNNER_TEMP/zig/bin/python" -c 'import os, ziglang; print(os.path.dirname(ziglang.__file__))' >> "$GITHUB_PATH"
      - name: Double-build, compare, and regenerate the reference
        timeout-minutes: 13
        run: |
          ./scripts/repro-build.sh --update | tee /tmp/repro.log
          grep -q IDENTICAL /tmp/repro.log
      - name: The tracked reference is what the script makes
        timeout-minutes: 3
        run: |
          if ! git diff --exit-code -- REPRODUCIBLE-HASHES.md; then
            echo "::error::REPRODUCIBLE-HASHES.md is not what scripts/repro-build.sh --update makes (the date, the sizes or the hashes). Run it and commit the file, in the commit that follows the code."
            exit 1
          fi

  licenses:
    # SPDX headers on every source file; dependency licenses, bans and sources.
    needs: monday
    if: ${{ !cancelled() && needs.monday.outputs.run != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - name: SPDX headers
        timeout-minutes: 3
        run: ./scripts/check-spdx.sh
      - name: No large tracked files outside the allow-list
        timeout-minutes: 3
        run: ./scripts/check-large-files.sh
      - name: panpak-core and panpak-stub use only zstd 0.14
        timeout-minutes: 3
        run: ./scripts/check-zstd-copies.sh
      - name: CI helper scripts
        timeout-minutes: 3
        run: |
          ./tests/ci-changes-test.sh
          ./tests/check-repro-date-test.sh
          ./tests/ci-gate-test.sh
          python3 -I tests/ci-workflow-test.py
      - name: Cache the cargo-deny binary
        timeout-minutes: 5
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2-${{ runner.os }}
      - name: cargo-deny (pinned version)
        timeout-minutes: 3
        run: |
          if ! ~/.cargo/bin/cargo-deny --version 2>/dev/null | grep -qF 0.20.2; then
            cargo install cargo-deny --locked --version 0.20.2
          fi
      - name: cargo-deny (licenses, bans, sources, advisories)
        timeout-minutes: 3
        # The RustSec advisory database is fetched fresh on every run, so new
        # advisories are reported even when nothing in the repository changed.
        run: cargo deny check

  distro:
    needs: [build-test, changes]
    if: ${{ !cancelled() && needs.changes.outputs.distro == 'true' && needs.build-test.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:12@sha256:d74df7598108a173a621eda4d58a2adbf850b2d9a9d81bc2cca1a6c21174a880 # debian:12
          - ubuntu:24.04@sha256:24737cef17f4e22b1977df7d9a05e77c4e28b7da5b8911f8d8ccda136bf3573c # ubuntu:24.04
          - fedora:43@sha256:a651ddf48ea28a06ed4e1e6519f51c9f47e7a5a138722ade87369b8fbb7e5b42 # fedora:43
          - alpine:3.22@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f # alpine:3.22
    steps:
      - name: Static stub from the build-test job
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: panpak-stub-musl
          path: /tmp/panpak-stub-dir
      - name: Static stub in container ${{ matrix.image }}
        timeout-minutes: 11
        run: |
          chmod +x /tmp/panpak-stub-dir/panpak-stub
          docker run --rm -v /tmp/panpak-stub-dir/panpak-stub:/panpak-stub:ro "${{ matrix.image }}" /panpak-stub --abi-version

  dco:
    # Developer Certificate of Origin: every new commit must be signed off. On a
    # pull request that is base..head; on a push to main, the pushed range.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          fetch-depth: 0
      - name: Signed-off-by on every commit
        timeout-minutes: 3
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            ./scripts/check-dco.sh "origin/$BASE_REF" "$PR_HEAD"
          elif [ "$PUSH_BEFORE" = 0000000000000000000000000000000000000000 ]; then
            echo "new branch: no previous commit to compare with"
          else
            ./scripts/check-dco.sh "$PUSH_BEFORE" "$PUSH_AFTER"
          fi

  secrets:
    # Scans the whole git history for leaked secrets.
    needs: monday
    if: ${{ !cancelled() && needs.monday.outputs.run != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          fetch-depth: 0
      - name: gitleaks (official release, pinned version and checksum)
        timeout-minutes: 3
        # The gitleaks program itself, not gitleaks-action (which needs a paid
        # licence for organisation repositories). Config: .gitleaks.toml.
        run: |
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks" && tar xzf gitleaks.tgz -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm gitleaks.tgz
          "$RUNNER_TEMP/gitleaks/gitleaks" git --log-opts="--all" --redact --no-banner .

  gate:
    # Passes only when every job ended as scripts/ci-gate.sh expects for this
    # event and these changed files. Runs even when a job before it failed or was
    # skipped, so a skip by mistake cannot look like a pass.
    if: ${{ always() }}
    needs: [monday, changes, build-test, rust-tests, private-bus, clippy, fuzz-smoke, repro, licenses, distro, dco, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - name: Every required job ran and succeeded
        timeout-minutes: 3
        env:
          EVENT: ${{ github.event_name }}
          MONDAY_RUN: ${{ needs.monday.outputs.run }}
          HEAVY: ${{ needs.changes.outputs.heavy }}
          FUZZ: ${{ needs.changes.outputs.fuzz }}
          DISTRO_ON: ${{ needs.changes.outputs.distro }}
          REPRO: ${{ needs.changes.outputs.repro }}
          R_MONDAY: ${{ needs.monday.result }}
          R_CHANGES: ${{ needs.changes.result }}
          R_BUILD_TEST: ${{ needs.build-test.result }}
          R_RUST_TESTS: ${{ needs.rust-tests.result }}
          R_PRIVATE_BUS: ${{ needs.private-bus.result }}
          R_CLIPPY: ${{ needs.clippy.result }}
          R_FUZZ_SMOKE: ${{ needs.fuzz-smoke.result }}
          R_REPRO_JOB: ${{ needs.repro.result }}
          R_LICENSES: ${{ needs.licenses.result }}
          R_DISTRO: ${{ needs.distro.result }}
          R_DCO: ${{ needs.dco.result }}
          R_SECRETS: ${{ needs.secrets.result }}
        run: ./scripts/ci-gate.sh

  release-guard:
    # Only on release tags: SECURITY.md must name the reporting channel, not a placeholder.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - name: Reporting channel defined
        timeout-minutes: 11
        run: |
          if grep -qF 'TO-BE-SET' SECURITY.md || ! grep -qF 'private vulnerability reporting' SECURITY.md; then
            echo "SECURITY.md must describe private vulnerability reporting and contain no placeholder before a release"
            exit 1
          fi
