# SPDX-License-Identifier: MIT OR Apache-2.0
# Panpak CI: build, test, clippy, fuzz smoke, reproducibility, distro matrix.
# No secrets (only the default read-only token), no publish.
#
# Where each job runs (the minutes budget is the reason for this split):
#   - always (pull request, push to main, manual and monthly runs): the fast
#     checks clippy, licenses (with cargo-deny), secrets and, on a pull request or
#     a push, DCO.
#   - pull_request: the heavy jobs (build-test with conformance, fuzz-smoke, repro,
#     distro) run only when the pull request touches more than documentation
#     (*.md and docs/**, see scripts/ci-changes.sh). A change to
#     REPRODUCIBLE-HASHES.md always starts repro.
#   - push to main: only the fast checks. main receives only fast-forwards of
#     commits that already passed every job in their pull request.
#   - workflow_dispatch and the monthly schedule: everything, with a longer fuzz
#     run on the schedule. This catches new advisories, new nightly toolchains
#     and drift in the base images even when nobody opens a pull request.
#     The schedule is monthly, not weekly, only while the repository is private
#     (every minute is billed): make it weekly again when the repository goes
#     public, where Actions minutes are free.
#   - gate: always the last job. It fails when a job that had to run did not
#     succeed, and also when a job that had to run was skipped
#     (scripts/ci-gate.sh). Require this job, not the others, in the branch rules.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # First Monday of the month, 03:17 UTC. Cron cannot say that: with both a
    # day of the month and a weekday, it fires when either matches. So the
    # trigger fires on days 1 to 7 and the monday job below lets only Monday through.
    - cron: "17 3 1-7 * *"

# One run per ref: a new push cancels the previous run of the same branch or pull
# request. The scheduled and manual runs have their own group, so a push to main
# does not cancel them.
concurrency:
  group: ci-${{ (github.event_name == 'push' || github.event_name == 'pull_request') && github.ref || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: true

defaults:
  run:
    # An explicit shell makes GitHub run bash -eo pipefail: a failing command
    # anywhere in a pipe fails the step. Every job runs directly on the
    # ubuntu-24.04 runner, none inside a container.
    shell: bash

env:
  RUST_TOOLCHAIN: "1.99.1"
  # Nightly used only by the fuzz-smoke job (libfuzzer needs -Z flags).
  FUZZ_NIGHTLY: "nightly-2026-10-20"

jobs:
  monday:
    # Scheduled runs only: continue on the first Monday of the month, stop on the
    # other days 1 to 7. Every other job lists this one in needs and starts unless
    # the answer is exactly "false" (the job is skipped on other events, which
    # leaves the answer empty).
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.monday.outputs.run }}
    steps:
      - name: First Monday of the month
        id: monday
        run: |
          if [ "$(date -u +%u)" = 1 ]; then run=true; else run=false; fi
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"

  changes:
    # Decides whether the heavy jobs are needed for a pull request. Plain git,
    # no third-party action. Not needed on push: the heavy jobs never run there.
    needs: monday
    if: ${{ !cancelled() && github.event_name != 'push' && needs.monday.outputs.run != 'false' }}
    runs-on: ubuntu-24.04
    outputs:
      heavy: ${{ steps.classify.outputs.heavy }}
      repro: ${{ steps.classify.outputs.repro }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify the changed files
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            ./scripts/ci-changes.sh "$BASE_SHA" "$HEAD_SHA" | tee -a "$GITHUB_OUTPUT"
          else
            printf 'heavy=true\nrepro=true\n' | tee -a "$GITHUB_OUTPUT"
          fi

  build-test:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache the Rust build (registry and target)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: build-test-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            build-test-${{ env.RUST_TOOLCHAIN }}-
      - name: Pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          rustup target add --toolchain "$RUST_TOOLCHAIN" x86_64-unknown-linux-musl
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Zig (pinned PyPI wheel, hash-checked)
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --require-hashes -r tools/requirements-zig.txt
          # Only the directory with the zig binary goes on PATH: the venv's python3
          # would hide the system Python that the conformance scripts need.
          "$RUNNER_TEMP/zig/bin/python" -c 'import os, ziglang; print(os.path.dirname(ziglang.__file__))' >> "$GITHUB_PATH"
      - name: Test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd python3 python3-cryptography
      - name: Test (musl)
        run: cargo test --locked --target x86_64-unknown-linux-musl
      - name: Release build (conformance and artifacts)
        run: cargo build --locked --release --target x86_64-unknown-linux-musl
      - name: Format conformance (independent verifier)
        run: |
          python3 conformance/gen.py
          python3 conformance/run.py --rust
      - name: Artifacts (static stub for the distro matrix)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: panpak-stub-musl
          path: target/x86_64-unknown-linux-musl/release/panpak-stub

  clippy:
    needs: monday
    if: ${{ !cancelled() && needs.monday.outputs.run != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache the Rust build (registry and target)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: clippy-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            clippy-${{ env.RUST_TOOLCHAIN }}-
      - name: Pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          rustup target add --toolchain "$RUST_TOOLCHAIN" x86_64-unknown-linux-musl
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Zig (pinned PyPI wheel, hash-checked)
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --require-hashes -r tools/requirements-zig.txt
          # Only the directory with the zig binary goes on PATH: the venv's python3
          # would hide the system Python that the conformance scripts need.
          "$RUNNER_TEMP/zig/bin/python" -c 'import os, ziglang; print(os.path.dirname(ziglang.__file__))' >> "$GITHUB_PATH"
      - name: Clippy (zero warnings)
        run: cargo clippy --locked --all-targets --target x86_64-unknown-linux-musl -- -D warnings

  fuzz-smoke:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    env:
      # 30 s per target on pull requests and manual runs, 5 min in the scheduled run.
      FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '300' || '30' }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_index
          - fuzz_manifest
          - fuzz_footer
          - fuzz_pubkey
          - fuzz_rotation
          - fuzz_path
          - fuzz_locks
          - fuzz_zstd
          - fuzz_elf
          - fuzz_squash
          - fuzz_http
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache the cargo-fuzz binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-0.13.2-${{ runner.os }}
      - name: Cache the fuzz build (registry and fuzz/target)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: fuzz-${{ env.FUZZ_NIGHTLY }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}
          restore-keys: |
            fuzz-${{ env.FUZZ_NIGHTLY }}-
      - name: Nightly toolchain (libfuzzer)
        run: |
          rustup toolchain install "$FUZZ_NIGHTLY" --profile minimal
          if ! ~/.cargo/bin/cargo-fuzz --version 2>/dev/null | grep -qF 0.13.2; then
            cargo install cargo-fuzz --locked --version 0.13.2
          fi
      - name: Fuzz smoke
        run: |
          cd fuzz
          cargo "+$FUZZ_NIGHTLY" fuzz run "${{ matrix.target }}" -- -max_total_time="$FUZZ_SECONDS" -print_final_stats=1

  repro:
    # No cache of any kind: the double build must start from nothing.
    needs: changes
    if: needs.changes.outputs.repro == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add --toolchain "$RUST_TOOLCHAIN" x86_64-unknown-linux-musl
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Zig (pinned PyPI wheel, hash-checked)
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --require-hashes -r tools/requirements-zig.txt
          # Only the directory with the zig binary goes on PATH: the venv's python3
          # would hide the system Python that the conformance scripts need.
          "$RUNNER_TEMP/zig/bin/python" -c 'import os, ziglang; print(os.path.dirname(ziglang.__file__))' >> "$GITHUB_PATH"
      - name: Double-build and compare
        run: |
          ./scripts/repro-build.sh | tee /tmp/repro.log
          grep -q IDENTICAL /tmp/repro.log
      - name: Compare with tracked reference hashes
        run: |
          grep -E '^[0-9a-f]{64}  ' /tmp/repro.log | awk '{print $1}' | sort -u > /tmp/actual.txt
          grep -E '^[0-9a-f]{64}  ' REPRODUCIBLE-HASHES.md | awk '{print $1}' | sort -u > /tmp/expected.txt
          diff /tmp/expected.txt /tmp/actual.txt

  licenses:
    # SPDX headers on every source file; dependency licenses, bans and sources.
    needs: monday
    if: ${{ !cancelled() && needs.monday.outputs.run != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: SPDX headers
        run: ./scripts/check-spdx.sh
      - name: No large tracked files outside the allow-list
        run: ./scripts/check-large-files.sh
      - name: panpak-core and panpak-stub use only zstd 0.14
        run: ./scripts/check-zstd-copies.sh
      - name: CI helper scripts
        run: |
          ./tests/ci-changes-test.sh
          ./tests/ci-gate-test.sh
      - name: Cache the cargo-deny binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2-${{ runner.os }}
      - name: cargo-deny (pinned version)
        run: |
          if ! ~/.cargo/bin/cargo-deny --version 2>/dev/null | grep -qF 0.20.2; then
            cargo install cargo-deny --locked --version 0.20.2
          fi
      - name: cargo-deny (licenses, bans, sources, advisories)
        # The RustSec advisory database is fetched fresh on every run, so new
        # advisories are reported even when nothing in the repository changed.
        run: cargo deny check

  distro:
    needs: [build-test, changes]
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:12@sha256:d74df7598108a173a621eda4d58a2adbf850b2d9a9d81bc2cca1a6c21174a880 # debian:12
          - ubuntu:24.04@sha256:24737cef17f4e22b1977df7d9a05e77c4e28b7da5b8911f8d8ccda136bf3573c # ubuntu:24.04
          - fedora:43@sha256:a651ddf48ea28a06ed4e1e6519f51c9f47e7a5a138722ade87369b8fbb7e5b42 # fedora:43
          - alpine:3.22@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f # alpine:3.22
    steps:
      - name: Static stub from the build-test job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: panpak-stub-musl
          path: /tmp/panpak-stub-dir
      - name: Static stub in container ${{ matrix.image }}
        run: |
          chmod +x /tmp/panpak-stub-dir/panpak-stub
          docker run --rm -v /tmp/panpak-stub-dir/panpak-stub:/panpak-stub:ro "${{ matrix.image }}" /panpak-stub --abi-version

  dco:
    # Developer Certificate of Origin: every new commit must be signed off. On a
    # pull request that is base..head; on a push to main, the pushed range.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Signed-off-by on every commit
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            ./scripts/check-dco.sh "origin/$BASE_REF" "$PR_HEAD"
          elif [ "$PUSH_BEFORE" = 0000000000000000000000000000000000000000 ]; then
            echo "new branch: no previous commit to compare with"
          else
            ./scripts/check-dco.sh "$PUSH_BEFORE" "$PUSH_AFTER"
          fi

  secrets:
    # Scans the whole git history for leaked secrets.
    needs: monday
    if: ${{ !cancelled() && needs.monday.outputs.run != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (official release, pinned version and checksum)
        # The gitleaks program itself, not gitleaks-action (which needs a paid
        # licence for organisation repositories). Config: .gitleaks.toml.
        run: |
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks" && tar xzf gitleaks.tgz -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm gitleaks.tgz
          "$RUNNER_TEMP/gitleaks/gitleaks" git --log-opts="--all" --redact --no-banner .

  gate:
    # Passes only when every job ended as scripts/ci-gate.sh expects for this
    # event and these changed files. Runs even when a job before it failed or was
    # skipped, so a skip by mistake cannot look like a pass.
    if: ${{ always() }}
    needs: [monday, changes, build-test, clippy, fuzz-smoke, repro, licenses, distro, dco, secrets]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every required job ran and succeeded
        env:
          EVENT: ${{ github.event_name }}
          MONDAY_RUN: ${{ needs.monday.outputs.run }}
          HEAVY: ${{ needs.changes.outputs.heavy }}
          REPRO: ${{ needs.changes.outputs.repro }}
          R_MONDAY: ${{ needs.monday.result }}
          R_CHANGES: ${{ needs.changes.result }}
          R_BUILD_TEST: ${{ needs.build-test.result }}
          R_CLIPPY: ${{ needs.clippy.result }}
          R_FUZZ_SMOKE: ${{ needs.fuzz-smoke.result }}
          R_REPRO_JOB: ${{ needs.repro.result }}
          R_LICENSES: ${{ needs.licenses.result }}
          R_DISTRO: ${{ needs.distro.result }}
          R_DCO: ${{ needs.dco.result }}
          R_SECRETS: ${{ needs.secrets.result }}
        run: ./scripts/ci-gate.sh

  release-guard:
    # Only on release tags: the security contact must be set, not a placeholder.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Security contact defined
        run: |
          if grep -qF '[SECURITY-CONTACT-TO-BE-SET]' SECURITY.md || ! grep -qF 'security@panpak.org' SECURITY.md; then
            echo "SECURITY.md must name security@panpak.org and contain no placeholder before a release"
            exit 1
          fi
