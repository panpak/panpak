# SPDX-License-Identifier: MIT OR Apache-2.0
# Panpak CI: build, test, clippy, fuzz smoke, reproducibility, distro matrix.
# Run on push/PR to main. No secrets (only the default read-only token), no publish.

name: ci

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    # An explicit shell makes GitHub run bash -eo pipefail: a failing command
    # anywhere in a pipe fails the step. Every job runs directly on the
    # ubuntu-24.04 runner, none inside a container.
    shell: bash

env:
  RUST_TOOLCHAIN: "1.99.1"
  # Nightly used only by the fuzz-smoke job (libfuzzer needs -Z flags).
  FUZZ_NIGHTLY: "nightly-2026-10-20"

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          rustup target add --toolchain "$RUST_TOOLCHAIN" x86_64-unknown-linux-musl
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Zig (pinned PyPI wheel, hash-checked)
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --require-hashes -r tools/requirements-zig.txt
          # Only the directory with the zig binary goes on PATH: the venv's python3
          # would hide the system Python that the conformance scripts need.
          "$RUNNER_TEMP/zig/bin/python" -c 'import os, ziglang; print(os.path.dirname(ziglang.__file__))' >> "$GITHUB_PATH"
      - name: Test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd python3 python3-cryptography
      - name: Test (musl)
        run: cargo test --locked --target x86_64-unknown-linux-musl
      - name: Release build (conformance and artifacts)
        run: cargo build --locked --release --target x86_64-unknown-linux-musl
      - name: Format conformance (independent verifier)
        run: |
          python3 conformance/gen.py
          python3 conformance/run.py --rust
      - name: Artifacts (static stub for the distro matrix)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: panpak-stub-musl
          path: target/x86_64-unknown-linux-musl/release/panpak-stub

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          rustup target add --toolchain "$RUST_TOOLCHAIN" x86_64-unknown-linux-musl
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Zig (pinned PyPI wheel, hash-checked)
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --require-hashes -r tools/requirements-zig.txt
          # Only the directory with the zig binary goes on PATH: the venv's python3
          # would hide the system Python that the conformance scripts need.
          "$RUNNER_TEMP/zig/bin/python" -c 'import os, ziglang; print(os.path.dirname(ziglang.__file__))' >> "$GITHUB_PATH"
      - name: Clippy (zero warnings)
        run: cargo clippy --locked --all-targets --target x86_64-unknown-linux-musl -- -D warnings

  fuzz-smoke:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_index
          - fuzz_manifest
          - fuzz_footer
          - fuzz_pubkey
          - fuzz_rotation
          - fuzz_path
          - fuzz_zstd
          - fuzz_elf
          - fuzz_squash
          - fuzz_http
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Nightly toolchain (libfuzzer)
        run: |
          rustup toolchain install "$FUZZ_NIGHTLY" --profile minimal
          cargo install cargo-fuzz --locked --version 0.13.2
      - name: Fuzz smoke for 2 minutes
        run: |
          cd fuzz
          cargo "+$FUZZ_NIGHTLY" fuzz run "${{ matrix.target }}" -- -max_total_time=120 -print_final_stats=1

  repro:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add --toolchain "$RUST_TOOLCHAIN" x86_64-unknown-linux-musl
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Cache the cargo registry (never target/)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cache/pip
          key: repro-${{ hashFiles('Cargo.lock', 'tools/requirements-zig.txt') }}
      - name: Zig (pinned PyPI wheel, hash-checked)
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --require-hashes -r tools/requirements-zig.txt
          # Only the directory with the zig binary goes on PATH: the venv's python3
          # would hide the system Python that the conformance scripts need.
          "$RUNNER_TEMP/zig/bin/python" -c 'import os, ziglang; print(os.path.dirname(ziglang.__file__))' >> "$GITHUB_PATH"
      - name: Double-build and compare
        run: |
          ./scripts/repro-build.sh | tee /tmp/repro.log
          grep -q IDENTICAL /tmp/repro.log
      - name: Compare with tracked reference hashes
        run: |
          grep -E '^[0-9a-f]{64}  ' /tmp/repro.log | awk '{print $1}' | sort -u > /tmp/actual.txt
          grep -E '^[0-9a-f]{64}  ' REPRODUCIBLE-HASHES.md | awk '{print $1}' | sort -u > /tmp/expected.txt
          diff /tmp/expected.txt /tmp/actual.txt

  licenses:
    # SPDX headers on every source file; dependency licenses, bans and sources.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: SPDX headers
        run: ./scripts/check-spdx.sh
      - name: No large tracked files outside the allow-list
        run: ./scripts/check-large-files.sh
      - name: panpak-core and panpak-stub use only zstd 0.14
        run: ./scripts/check-zstd-copies.sh
      - name: cargo-deny (pinned version)
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: cargo-deny (licenses, bans, sources, advisories)
        # The RustSec advisory database is fetched fresh on every run, so new
        # advisories are reported even when nothing in the repository changed.
        run: cargo deny check

  distro:
    needs: build-test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:12@sha256:d74df7598108a173a621eda4d58a2adbf850b2d9a9d81bc2cca1a6c21174a880 # debian:12
          - ubuntu:24.04@sha256:24737cef17f4e22b1977df7d9a05e77c4e28b7da5b8911f8d8ccda136bf3573c # ubuntu:24.04
          - fedora:43@sha256:a651ddf48ea28a06ed4e1e6519f51c9f47e7a5a138722ade87369b8fbb7e5b42 # fedora:43
          - alpine:3.22@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f # alpine:3.22
    steps:
      - name: Static stub from the build-test job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: panpak-stub-musl
          path: /tmp/panpak-stub-dir
      - name: Static stub in container ${{ matrix.image }}
        run: |
          chmod +x /tmp/panpak-stub-dir/panpak-stub
          docker run --rm -v /tmp/panpak-stub-dir/panpak-stub:/panpak-stub:ro "${{ matrix.image }}" /panpak-stub --abi-version

  dco:
    # Developer Certificate of Origin: every commit of a PR must be signed off.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Signed-off-by on every commit
        run: ./scripts/check-dco.sh "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"

  secrets:
    # Scans the whole git history for leaked secrets.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: gitleaks (official release, pinned version and checksum)
        # The gitleaks program itself, not gitleaks-action (which needs a paid
        # licence for organisation repositories). Config: .gitleaks.toml.
        run: |
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks" && tar xzf gitleaks.tgz -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm gitleaks.tgz
          "$RUNNER_TEMP/gitleaks/gitleaks" git --log-opts="--all" --redact --no-banner .

  release-guard:
    # Only on release tags: the security contact must be set, not a placeholder.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Security contact defined
        run: |
          if grep -qF '[SECURITY-CONTACT-TO-BE-SET]' SECURITY.md || ! grep -qF 'security@panpak.org' SECURITY.md; then
            echo "SECURITY.md must name security@panpak.org and contain no placeholder before a release"
            exit 1
          fi
