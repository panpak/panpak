# qBittorrent 5.3.0 with libtorrent 2.1.2, the versions that Flathub has (org.qbittorrent.qBittorrent) on 2026-11-20, for the comparison of step 9b.
# The source is the tag release-5.3.0 (the commit that the tag points at). libtorrent is built here from its release archive (the hash is the one that Flathub pins),
# statically and with C++20 like the Flatpak does; Boost is the one of the image (the Flatpak builds Boost 1.92 itself: headers only for both, and said in the results).
[app]
id = "org.qbittorrent.qBittorrent"
name = "qBittorrent"
version = "5.3.0"
entry = "bin/qbittorrent"

[source]
git = "https://github.com/qbittorrent/qBittorrent.git"
commit = "9213075dd5f7b352208361c6a84c1c115efc898e"

[build]
system = "cmake"
configure = [
  "-DCMAKE_BUILD_TYPE=Release", "-DCMAKE_INSTALL_PREFIX=/usr", "-DCMAKE_INSTALL_LIBDIR=lib",
  "-DGUI=ON", "-DWEBUI=ON", "-DSYSTEMD=OFF", "-DSTACKTRACE=OFF", "-DTESTING=OFF",
]
packages = [
  "cmake", "ninja-build", "qt6-base-dev", "qt6-base-private-dev", "qt6-tools-dev", "qt6-tools-dev-tools", "qt6-l10n-tools",
  "libqt6svg6-dev", "qt6-svg-plugins", "qt6-xdgdesktopportal-platformtheme", "qt6-wayland",
  "libboost-dev", "libssl-dev", "zlib1g-dev",
]
writable_source = true
memory = "6G"
jobs = 4
memory_per_job = "1.2G"

[[build.deps]]
name = "libtorrent-rasterbar"
url = "https://github.com/arvidn/libtorrent/releases/download/v2.1.2/libtorrent-rasterbar-2.1.2.tar.gz"
sha256 = "3362546d9cd71b9e49ee6cac7d3f1f914ce9cdb217c86b63d5b22cbed0334dbc"
configure = ["-DBUILD_SHARED_LIBS=OFF", "-DCMAKE_CXX_STANDARD=20", "-Ddeprecated-functions=OFF"]

[collect]
toolkit = "qt6"

[desktop]
wm_class = "org.qbittorrent.qBittorrent"
icon_svg = "share/icons/hicolor/scalable/apps/qbittorrent.svg"

[permissions]
network = true
network_allow_tcp = [80, 443]
network_bind_tcp = [6881]
notifications = true
tray = true
dbus_own = ["org.qbittorrent.qBittorrent"]

[[permissions.xdg_dirs]]
name = "download"
access = "rw"

[license]
spdx = "GPL-3.0-or-later"
files = ["COPYING"]
bundled = "auto"
