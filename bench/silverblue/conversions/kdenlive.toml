# What the converter declares for Kdenlive: network, sound (the Flatpak has pulseaudio), the user folders where video, music, pictures and projects are, the file dialog of the portal.
# Not given, because Panpak has no equivalent: `--device=all` (cameras and capture devices), `--filesystem=host` (every folder, by path), the system bus (UDisks2: mounting drives).
[permissions]
network = true
audio = true
# KDBusService registers the name of the app on the session bus (`org.kde.kdenlive`); without it Kdenlive says that there is no session bus and does not start.
dbus_own = ["org.kde.kdenlive"]

[permissions.portal]
files = "picker"

# The AppImage carries the Qt platform theme `xdgdesktopportal` (usr/plugins/platformthemes/libqxdgdesktopportal.so) and no `gtk2`, and its hook (apprun-hooks/linuxdeploy-plugin-qt-hook.sh) asks for `gtk2` on
# GNOME and XFCE: Qt is told to use the portal theme (its file dialogs and settings come from the portal of the session). To check on the VM (P12).
[launch.env]
QT_QPA_PLATFORMTHEME = "xdgdesktopportal"

[[permissions.xdg_dirs]]
name = "videos"
access = "rw"

[[permissions.xdg_dirs]]
name = "music"
access = "rw"

[[permissions.xdg_dirs]]
name = "pictures"
access = "rw"

[[permissions.xdg_dirs]]
name = "documents"
access = "rw"

[[permissions.xdg_dirs]]
name = "download"
access = "rw"
