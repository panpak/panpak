# What the converter declares for GIMP: the functions that the Flatpak of Flathub gives it (network, the user folders it works on, the file dialog of the portal), as far as Panpak has an
# equivalent. What the Flatpak gives and Panpak does not (PROCEDURE.md section 2): `--device=all` (graphics tablets and every other device), `--filesystem=host` (every folder, by path),
# the screenshot and file manager services of the session, and gvfs.
[permissions]
network = true

[permissions.portal]
files = "picker"

[[permissions.xdg_dirs]]
name = "pictures"
access = "rw"

[[permissions.xdg_dirs]]
name = "documents"
access = "rw"

[[permissions.xdg_dirs]]
name = "download"
access = "rw"
