# Explicit linkers for musl targets: without them, rustc uses the system `cc` and
# the result depends on the host binutils (build-id present/absent).
# Requires x86_64-linux-musl-gcc (musl.cc or musl-tools) on PATH.
[target.x86_64-unknown-linux-musl]
linker = "x86_64-linux-musl-gcc"

[target.aarch64-unknown-linux-musl]
linker = "aarch64-linux-musl-gcc"
